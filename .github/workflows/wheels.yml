name: Wheels (dry run)

# Builds wheels + sdist and uploads them as workflow artifacts only.
# Nothing is published to PyPI from this workflow (Phase 0 dry run).
on:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: one native runner per architecture (the build imports the module
        # to generate type stubs, so cross-compiling x86_64 on arm64 is avoided).
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14            # Apple Silicon (arm64)
            macos_target: "11.0"
          - os: macos-15-intel      # Intel (x86_64)
            macos_target: "10.15"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        # Configuration lives in [tool.cibuildwheel] in pyproject.toml
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check sdist builds from source
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP" && python -c "import modde._core as c; print(c.build_info())"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
