name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # D-A18: Windows x64 + Linux x86_64, Python 3.11 (matches the main dev machine)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" -v

      - name: Show build info
        working-directory: ${{ runner.temp }}
        run: python -c "import modde, modde._core as c; print(modde.__version__, c.build_info())"

      - name: Run tests
        run: pytest

  irace-format:
    name: irace reads the exported files (D-C10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@v2

      - name: Install irace
        run: Rscript -e 'install.packages("irace", repos = "https://cloud.r-project.org")'

      - name: Build and install
        run: python -m pip install ".[test]"

      - name: Check the irace files with irace itself
        run: pytest tests/test_irace.py -rs
